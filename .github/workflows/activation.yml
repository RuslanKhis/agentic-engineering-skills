name: Activation evaluation

# Measures skill selection from descriptions with a live model. It costs API
# credit, so it runs only on request; the per-push Skill checks stay offline.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Selector model
        type: choice
        default: claude-sonnet-5-5
        options:
          - claude-sonnet-5-5
          - claude-opus-5-5
          - claude-haiku-5-5
      repeat:
        description: Independent reshuffled runs
        default: '2'
      only:
        description: Comma-separated skills to run (empty for all cases)
        default: ''
  # Weekly run, off until the cost is agreed:
  # schedule:
  #   - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run the selector over the activation corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          REPEAT: ${{ inputs.repeat || '2' }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          mkdir -p results
          args=(--backend anthropic --model "$MODEL" --repeat "$REPEAT" --out results/activation.json)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python scripts/run_activation.py "${args[@]}" | tee results/summary.md
      - name: Add the summary to the job page
        if: always()
        run: if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: activation-results
          path: results/
          if-no-files-found: warn
