  short_description: "Carry employer and client context across projects"
  default_prompt: "Use $practice-profile to set up my practice profile: interview me on the core questions (menus with don't know for company facts, recommended answers only for conventions), or import facts from Markdown files I name and confirm them line by line, create the files outside this repository, and bind this repository to the right org."
