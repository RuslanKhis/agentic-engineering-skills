# Veldmark Industrial: a fictional engineering manufacturer (demo brand; see ../README.md).
# Only the DESIGN.md Brand override surface. Read by scripts/apply_brand.py, which
# accepts a YAML subset: `key: value` lines and one level of two-space nesting.
# chart-1 keeps the house blue: a petrol chart-1 would look like the fixed teal chart-2.
name: Veldmark Industrial
fictional: true
colors:
  primary: "oklch(0.42 0.068 192)"
  primary-hover: "oklch(0.35 0.058 192)"
  primary-active: "oklch(0.29 0.048 192)"
  primary-foreground: "oklch(0.985 0.003 85)"
  accent: "oklch(0.948 0.018 192)"
  accent-foreground: "oklch(0.30 0.05 192)"
  ring: "oklch(0.50 0.082 192)"
  chart-1: "oklch(0.50 0.095 250)"
  dark-primary: "oklch(0.78 0.08 192)"
  dark-primary-hover: "oklch(0.84 0.065 192)"
  dark-primary-active: "oklch(0.72 0.085 192)"
  dark-primary-foreground: "oklch(0.20 0.03 192)"
  dark-accent: "oklch(0.29 0.028 192)"
  dark-accent-foreground: "oklch(0.91 0.025 192)"
  dark-ring: "oklch(0.74 0.08 192)"
  dark-chart-1: "oklch(0.74 0.09 250)"
fonts:
  sans: Geologica
  sans-package: "@fontsource-variable/geologica@5.3.0"
  serif: Source Serif 4
  serif-package: "@fontsource-variable/source-serif-4@5.3.1"
  serif-css: wght.css  # house rule: wght, not opsz (a larger file for little gain at 17 px)
  mono: JetBrains Mono
  mono-package: "@fontsource-variable/jetbrains-mono@5.3.0"
logo:
  logo: logo.svg
  mark: mark.svg
  alt: "Veldmark Industrial (fictional company)"
rounded:
  md: 4px
