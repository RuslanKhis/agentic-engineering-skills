interface:
  display_name: "ADK Agent Observability"
  short_description: "Instrument, monitor, alert on and debug ADK agents"
  default_prompt: "Use $adk-agent-observability to inspect this ADK agent's telemetry (exporters, environment gates, plugins, logging), then define the signals, SLOs, alerts and trace-to-evaluation hand-off it needs in production."
policy:
  allow_implicit_invocation: true
