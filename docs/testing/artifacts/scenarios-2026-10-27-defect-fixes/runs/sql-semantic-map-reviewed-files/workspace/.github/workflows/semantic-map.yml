name: semantic-map
on:
  pull_request:
    paths: ["semantic/**", "analytics/**", "tests/**", "pyproject.toml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The gate: fails on a missing cardinality or condition, unknown table or column, missing
      # primary key, a "one" side not joined on its key, unreviewed files, and stored SQL the
      # read-only policy rejects or cannot parse. No BigQuery or model calls.
      - run: python -m analytics.semantic
      - run: python -m unittest discover -s tests -t .
