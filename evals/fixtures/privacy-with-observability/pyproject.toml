[project]
name = "travel-desk-agent"
version = "0.2.0"
description = "Travel desk assistant for Oakmere staff"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[bigquery-analytics]==2.12.0",
  "google-cloud-aiplatform[agent-engines]==1.121.0",
  "opentelemetry-instrumentation-google-genai==0.4b0",
  "opentelemetry-exporter-gcp-trace==1.9.0",
  "opentelemetry-exporter-gcp-logging==1.9.0a0",
  "gcsfs==2025.9.0",
  "fastapi==0.118.0",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.agents-cli]
manifest = "agents-cli-manifest.yaml"
