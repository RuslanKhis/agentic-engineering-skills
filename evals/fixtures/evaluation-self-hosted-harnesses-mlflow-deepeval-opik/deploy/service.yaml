apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: support-assistant
  labels:
    app: support-assistant
    env: prod
spec:
  template:
    spec:
      serviceAccountName: support-agent@harbour-support-prod.iam.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/harbour-support-prod/apps/support-assistant:0.4.0
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: harbour-support-prod
            - name: GOOGLE_CLOUD_LOCATION
              value: europe-west1
            - name: MODEL_ID
              value: gemini-3.5-flash
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "false"
            - name: ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS
              value: "false"
