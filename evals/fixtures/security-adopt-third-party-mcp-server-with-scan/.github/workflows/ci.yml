name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t .
  mcp-definitions:
    runs-on: ubuntu-latest
    container: nikolaik/python-nodejs:python3.12-nodejs22-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - name: Freightline tool definitions match the recorded manifest
        run: python scripts/check_mcp_definitions.py
