name: ci
on:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t .
  mcp-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ledgerline tool definitions match the recorded inventory
        env:
          LEDGERLINE_TOKEN: ${{ secrets.LEDGERLINE_TOKEN }}
        run: python scripts/check_mcp_inventory.py
