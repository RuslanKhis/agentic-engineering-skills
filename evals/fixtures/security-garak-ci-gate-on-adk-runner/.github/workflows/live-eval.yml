name: live-eval
# Approved live runs against Gemini only. Started by hand after the owner approves the run.
on:
  workflow_dispatch:
    inputs:
      approval_ref:
        description: "Approval ticket for this paid run"
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-eval
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/482216093311/locations/global/workloadIdentityPools/ci/providers/github
          service_account: live-eval@harbour-support-eval.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: ADK eval
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: harbour-support-eval
          GOOGLE_CLOUD_LOCATION: europe-west4
        run: adk eval app tests/eval/support.evalset.json
